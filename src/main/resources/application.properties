spring.application.name=zebratravelB
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zebratravel_db}
spring.datasource.username=${DB_USER:zebratravel}
spring.datasource.password=${DB_PASSWORD:zebra_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - schema is owned by Flyway migrations, Hibernate must not alter it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator - only /actuator/health is exposed (used by docker-compose healthcheck)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT
app.jwt.secret=${JWT_SECRET:change-this-prod-secret-key-please-please-32bytes-min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:21600000}

# CORS - allow the client (zebratravel) and admin (zebradash) frontends
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Media library storage
app.media.upload-dir=${MEDIA_UPLOAD_DIR:./uploads}
# Images uploaded here (except SVG/already-WebP) are converted to WebP at this quality (0-100)
app.media.webp-quality=${MEDIA_WEBP_QUALITY:82}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Private document storage (passport photos, etc.) - deliberately NOT under app.media.upload-dir
# and NOT registered in WebConfig's resource handler, so files here are never served by the
# static /uploads/** mapping. Only reachable through an authenticated controller endpoint.
app.documents.upload-dir=${DOCUMENTS_UPLOAD_DIR:./private-uploads}

# Frontend base URL (used to redirect the user's browser back after payment)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# SISP / Vinti4 payment gateway - defaults are SISP's own public test/sandbox credentials
# (used in their official NodeJS_vbv2 sample). Replace with real merchant credentials in production.
app.vinti4.pos-id=${VINTI4_POS_ID:90051}
app.vinti4.pos-aut-code=${VINTI4_POS_AUT_CODE:123456789A}
app.vinti4.currency=${VINTI4_CURRENCY:132}
app.vinti4.gateway-url=${VINTI4_GATEWAY_URL:https://mc.vinti4net.cv/BizMPIOnUs/CardPayment}
# Must be a URL reachable from the internet in production (SISP's servers POST here).
app.vinti4.callback-url=${VINTI4_CALLBACK_URL:http://localhost:8080/api/payments/vinti4/callback}
