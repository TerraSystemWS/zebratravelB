services:
  postgres:
    image: postgres:15
    container_name: zebratravel_db
    environment:
      POSTGRES_DB: zebratravel_db
      POSTGRES_USER: zebratravel
      POSTGRES_PASSWORD: zebra_password
    ports:
      - "5432:5432"
    volumes:
      - zebratravel_db_data:/var/lib/postgresql/data

volumes:
  zebratravel_db_data:
